name: Secret scan (full history)

# The CI secret scan only sees each PR's own commits, and on a push to main
# (always a merge commit here) it scans nothing. This sweeps every commit in
# the repository weekly and on demand, so a secret that slipped in by any path
# — a direct push, a PR opened before the scan existed — still fails loudly.
# Known historical leaks are allowlisted by commit SHA in .gitleaks.toml.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

jobs:
  full-history:
    name: gitleaks (all commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
