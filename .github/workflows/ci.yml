name: CI

# Gate every PR and every push to main on: type check, unit tests, and secret
# scanning. The secret scan exists because commit efeb01b once added a real
# .env to this public repo's permanent history (backlog E0.1) — gitleaks makes
# that class of mistake fail the build instead of leaking live credentials.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One group per PR (superseded pushes are cancelled) but one per COMMIT on
  # main: a shared main group cancels any queued run when a newer one queues,
  # which is how the merges of #16-#18 lost their main test runs on 2026-09-26
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is fetched, but the action scans only the PR's
          # commits on pull_request, and on a push to main it scans the pushed
          # range with --no-merges --first-parent — which is EMPTY for a merge
          # commit. PR runs are the real gate; secret-scan-full.yml sweeps the
          # whole history weekly. Known historical leaks are allowlisted by
          # commit SHA in .gitleaks.toml — anything NEW fails the run.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
